<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Lalamove - Parcela da Moto</title>
    <link rel="icon" href="beija.png">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --stat-box-bg: #0f172a;
        }

        body.light-mode {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --input-bg: #f1f5f9;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --stat-box-bg: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { max-width: 500px; margin: 0 auto; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 50%;
        }

        .title-container h1 {
            font-size: 1.15rem;
            margin: 0;
            color: var(--text);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
            border: 1px solid var(--border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background: var(--stat-box-bg); padding: 12px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .stat-box.full { grid-column: span 2; }
        .stat-value { font-size: 1.2rem; font-weight: bold; margin-top: 4px; }
        .text-green { color: var(--success); }
        .text-orange { color: var(--warning); }
        .text-blue { color: var(--primary); }

        label { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); display: block; margin-top: 8px; }
        
        input, select {
            width: 100%; padding: 12px; margin-top: 4px; margin-bottom: 8px;
            background-color: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button { 
            width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 8px;
            background: var(--primary); color: white; border: none; 
            border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; 
            transition: background 0.2s;
        }

        button:active { filter: brightness(0.9); }
        button.btn-green { background: var(--success); }
        button.btn-google { background: #ea4335; color: white; margin-top: 4px; }
        button.btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 6px; }
        button.btn-small { width: auto; padding: 6px 12px; font-size: 0.85rem; margin: 0; }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .btn-del { background: none; border: none; color: var(--danger); font-size: 1rem; cursor: pointer; width: auto; padding: 2px 8px; margin: 0; }
        .flex-row { display: flex; gap: 8px; }
        .flex-row > div { flex: 1; }
        .hidden { display: none !important; }
        .details-box { background: var(--input-bg); padding: 8px; border-radius: 6px; margin-top: 6px; font-size: 0.85rem; }
        .loading { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 10px; }
        .divider { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 12px 0; position: relative; }

        /* MODAL / POP-UP */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-card h4 { margin-top: 0; color: var(--danger); font-size: 1.1rem; }
        .modal-card p { font-size: 0.95rem; color: var(--text); margin: 12px 0; word-break: break-word; }
        .modal-card button { margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="title-container">
            <img src="beija.png" alt="Logo" class="brand-logo">
            <h1>Gestão De Corridas</h1>
        </div>
        <div class="header-actions">
            <button class="btn-outline btn-small" id="btnToggleTheme" type="button">☀️</button>
            <button class="btn-outline btn-small hidden" id="btnToggleHist" type="button">
                <!-- Ícone de Olho Fechado com Cílios estilo a imagem enviada -->
                <svg width="18" height="18" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" style="vertical-align: middle;">
                    <path d="M 12 35 C 35 75, 65 75, 88 35" />
                    <line x1="26" y1="58" x2="20" y2="78" />
                    <line x1="43" y1="67" x2="40" y2="88" />
                    <line x1="57" y1="67" x2="60" y2="88" />
                    <line x1="74" y1="58" x2="80" y2="78" />
                </svg>
                Histórico
            </button>
            <button class="btn-outline btn-small hidden" id="btnLogout" type="button">🚪 Sair</button>
        </div>
    </div>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div class="card" id="cardAuth">
        <h3 id="authTitle" style="margin-top:0;">Acessar Conta</h3>
        
        <label>E-mail:</label>
        <input type="email" id="authEmail" placeholder="seuemail@gmail.com">
        
        <label>Senha:</label>
        <input type="password" id="authPassword" placeholder="******">
        
        <button type="button" id="btnEntrar">Entrar</button>
        <button type="button" class="btn-outline" id="btnCadastrar" style="width: 100%;">Criar Conta com E-mail</button>
        
        <div class="divider">ou use sua conta Google</div>

        <button type="button" class="btn-google" id="btnGoogleAuth">🌐 Entrar com Google</button>
    </div>

    <!-- ÁREA PRINCIPAL DO APP -->
    <div id="appContent" class="hidden">
        <!-- HISTÓRICO NA NUVEM -->
        <div class="card hidden" id="cardHistorico">
            <h3 style="margin-top:0;">Histórico na Nuvem</h3>
            <label>Filtrar por Mês:</label>
            <select id="filtroMes">
                <option value="TODOS">Todos os Meses</option>
            </select>

            <div id="listaHistorico" style="margin-top: 10px;">
                <div class="loading">Carregando dados da nuvem...</div>
            </div>
        </div>

        <!-- PAINEL DE METAS -->
        <div class="card dashboard">
            <div class="stat-box">
                <small style="color: var(--text-muted);">Meta Parcela</small>
                <div class="stat-value text-blue" id="metaDisplay">R$ 1.200,00</div>
            </div>
            <div class="stat-box">
                <small style="color: var(--text-muted);">Falta para Meta</small>
                <div class="stat-value text-orange" id="faltaDisplay">R$ 1.200,00</div>
            </div>
            <div class="stat-box full">
                <small style="color: var(--text-muted);">Total Acumulado no Bolso (Líquido)</small>
                <div class="stat-value text-green" id="lucroTotalDisplay">R$ 0,00</div>
            </div>
        </div>

        <!-- LANÇAMENTO DE CORRIDAS DO DIA -->
        <div class="card" id="cardLancarCorrida">
            <h3>Lançar Corrida</h3>
            <label>Data do Trabalho:</label>
            <input type="date" id="dataTrabalho">

            <label>Valor da Corrida (R$):</label>
            <input type="number" id="valorCorrida" step="any" placeholder="ex: 15.50">
            <button type="button" id="btnAddCorrida">+ Adicionar Corrida</button>
            
            <div id="listaCorridasHoje" style="margin-top: 10px;"></div>
        </div>

        <!-- FECHAMENTO DO DIA -->
        <div class="card" id="cardFecharExpediente">
            <h3>Fechar Expediente</h3>
            <div class="flex-row">
                <div>
                    <label>Odômetro (km):</label>
                    <input type="number" id="odometroKm" step="any" placeholder="66.0">
                </div>
                <div>
                    <label>Média (km/L):</label>
                    <input type="number" id="mediaKmL" step="any" placeholder="37.7">
                </div>
            </div>
            <button class="btn-green" type="button" id="btnFecharDia">Calcular e Salvar</button>
        </div>
    </div>
</div>

<!-- MODAL DE ERROS / AVISOS -->
<div id="errorModal" class="modal-overlay hidden">
    <div class="modal-card">
        <h4 id="modalTitle">⚠️ Atenção</h4>
        <p id="modalMessage">Ocorreu um erro no sistema.</p>
        <button type="button" id="btnCloseModal">Entendi</button>
    </div>
</div>

<!-- SCRIPTS DO FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFCTvdlfxoyi9aD-iSx68jiDQYjncNoBQ",
        authDomain: "gestao-lalamove.firebaseapp.com",
        projectId: "gestao-lalamove",
        storageBucket: "gestao-lalamove.firebasestorage.app",
        messagingSenderId: "1059776874946",
        appId: "1:1059776874946:web:23598f5e6d15069e532e5b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let metaParcela = 1200.00;
    let precoGasolina = 6.00;
    let corridasHoje = JSON.parse(localStorage.getItem('corridasHoje')) || [];
    let historicoNuvem = [];

    // POP-UP DE ERRO
    function showErrorPopup(message, title = "⚠️ Erro na Autenticação") {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMessage').innerText = message;
        document.getElementById('errorModal').classList.remove('hidden');
    }

    document.getElementById('btnCloseModal').addEventListener('click', () => {
        document.getElementById('errorModal').classList.add('hidden');
    });

    // MAPEAMENTO DE ERROS DO FIREBASE
    function handleFirebaseError(error) {
        console.error("Firebase Error Code:", error.code);
        switch (error.code) {
            case 'auth/invalid-credential':
                showErrorPopup('E-mail ou senha incorretos, ou a conta ainda não foi criada.');
                break;
            case 'auth/user-not-found':
                showErrorPopup('Nenhuma conta encontrada com este e-mail. Clique em "Criar Conta com E-mail" para se cadastrar.');
                break;
            case 'auth/wrong-password':
                showErrorPopup('Senha incorreta. Verifique os dados digitados.');
                break;
            case 'auth/email-already-in-use':
                showErrorPopup('Este e-mail já está cadastrado. Tente fazer login.');
                break;
            case 'auth/invalid-email':
                showErrorPopup('Por favor, digite um endereço de e-mail válido.');
                break;
            case 'auth/weak-password':
                showErrorPopup('A senha deve ter no mínimo 6 caracteres.');
                break;
            case 'auth/unauthorized-domain':
                showErrorPopup('Este domínio não está autorizado no Console do Firebase em Authentication > Configurações > Domínios Autorizados.');
                break;
            case 'auth/operation-not-allowed':
                showErrorPopup('Este método de login está desativado no Console do Firebase (Authentication > Método de login).');
                break;
            case 'auth/popup-closed-by-user':
                showErrorPopup('A janela de login do Google foi fechada antes de concluir o acesso.');
                break;
            case 'auth/popup-blocked':
                showErrorPopup('O navegador bloqueou o pop-up de login. Permita pop-ups para este site.');
                break;
            case 'auth/network-request-failed':
                showErrorPopup('Falha de conexão com a internet. Verifique sua rede.');
                break;
            default:
                showErrorPopup(`Erro não identificado (${error.code || 'Desconhecido'}): ${error.message}`);
                break;
        }
    }

    const inputData = document.getElementById('dataTrabalho');
    if (!inputData.value) {
        inputData.value = new Date().toISOString().split('T')[0];
    }

    // Gerenciador de Tema
    const btnTheme = document.getElementById('btnToggleTheme');
    btnTheme.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        btnTheme.innerText = isLight ? '🌙' : '☀️';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });

    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
        btnTheme.innerText = '🌙';
    } else {
        btnTheme.innerText = '☀️';
    }

    // --- AUTENTICAÇÃO ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('cardAuth').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            document.getElementById('btnToggleHist').classList.remove('hidden');
            document.getElementById('btnLogout').classList.remove('hidden');
            carregarDadosNuvem();
        } else {
            currentUser = null;
            document.getElementById('cardAuth').classList.remove('hidden');
            document.getElementById('appContent').classList.add('hidden');
            document.getElementById('btnToggleHist').classList.add('hidden');
            document.getElementById('btnLogout').classList.add('hidden');
        }
    });

    // Login com Google
    document.getElementById('btnGoogleAuth').addEventListener('click', async () => {
        try {
            await signInWithPopup(auth, googleProvider);
        } catch (error) {
            handleFirebaseError(error);
        }
    });

    // Login com E-mail
    document.getElementById('btnEntrar').addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;

        if (!email || !password) {
            showErrorPopup('Preencha os campos de e-mail e senha.');
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            handleFirebaseError(error);
        }
    });

    // Cadastro com E-mail
    document.getElementById('btnCadastrar').addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;

        if (!email || !password) {
            showErrorPopup('Preencha os campos de e-mail e senha.');
            return;
        }

        try {
            await createUserWithEmailAndPassword(auth, email, password);
            showErrorPopup('Conta criada com sucesso! Você já está conectado.', '🎉 Sucesso');
        } catch (error) {
            handleFirebaseError(error);
        }
    });

    document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

    // --- MANIPULAÇÃO DE DADOS ---
    document.getElementById('btnToggleHist').addEventListener('click', toggleHistorico);
    document.getElementById('btnAddCorrida').addEventListener('click', adicionarCorridaLocal);
    document.getElementById('btnFecharDia').addEventListener('click', fecharDia);
    document.getElementById('filtroMes').addEventListener('change', renderizarHistorico);

    async function carregarDadosNuvem() {
        if (!currentUser) return;
        try {
            const q = query(collection(db, "historico_entregas"), where("uid", "==", currentUser.uid));
            const querySnapshot = await getDocs(q);
            historicoNuvem = [];
            querySnapshot.forEach((docSnap) => {
                historicoNuvem.push({ firebaseId: docSnap.id, ...docSnap.data() });
            });
            atualizarTelaGeral();
        } catch (error) {
            console.error("Erro ao carregar do Firebase:", error);
            document.getElementById('listaHistorico').innerHTML = '<span style="color: var(--danger);">Erro ao carregar do banco.</span>';
        }
    }

    function toggleHistorico() {
        const cardHist = document.getElementById('cardHistorico');
        const cardLancar = document.getElementById('cardLancarCorrida');
        const cardFechar = document.getElementById('cardFecharExpediente');
        const btn = document.getElementById('btnToggleHist');

        if (cardHist.classList.contains('hidden')) {
            cardHist.classList.remove('hidden');
            cardLancar.classList.add('hidden');
            cardFechar.classList.add('hidden');
            btn.innerHTML = '😌 Ocultar';
        } else {
            cardHist.classList.add('hidden');
            cardLancar.classList.remove('hidden');
            cardFechar.classList.remove('hidden');
            btn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" style="vertical-align: middle;">
                    <path d="M 12 35 C 35 75, 65 75, 88 35" />
                    <line x1="26" y1="58" x2="20" y2="78" />
                    <line x1="43" y1="67" x2="40" y2="88" />
                    <line x1="57" y1="67" x2="60" y2="88" />
                    <line x1="74" y1="58" x2="80" y2="78" />
                </svg>
                Histórico
            `;
        }
    }

    function adicionarCorridaLocal() {
        const input = document.getElementById('valorCorrida');
        const valor = parseFloat(input.value.replace(',', '.'));
        
        if (isNaN(valor) || valor <= 0) {
            showErrorPopup('Digite um valor numérico válido para a corrida.', '⚠️ Valor Inválido');
            return;
        }

        corridasHoje.push(valor);
        input.value = '';
        salvarLocalEAtualizar();
    }

    async function fecharDia() {
        const btnFechar = document.getElementById('btnFecharDia');

        try {
            if (corridasHoje.length === 0) {
                showErrorPopup('Adicione pelo menos uma corrida antes de fechar o dia.', '⚠️ Nenhuma corrida');
                return;
            }

            const dataVal = document.getElementById('dataTrabalho').value;
            const odoVal = document.getElementById('odometroKm').value;
            const mediaVal = document.getElementById('mediaKmL').value;

            const odometro = parseFloat(String(odoVal).replace(',', '.'));
            const media = parseFloat(String(mediaVal).replace(',', '.'));

            if (isNaN(odometro) || isNaN(media) || odometro <= 0 || media <= 0) {
                showErrorPopup('Preencha o odômetro e a média de consumo com valores válidos.', '⚠️ Dados Incompletos');
                return;
            }

            let dataFormatada = "";
            let mesAno = "";

            if (dataVal.includes('-')) {
                const partes = dataVal.split('-');
                dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
                mesAno = `${partes[1]}/${partes[0]}`;
            }

            const totalBruto = corridasHoje.reduce((a, b) => a + b, 0);
            const gastoGasolina = (odometro / media) * precoGasolina;
            const lucroLiquido = totalBruto - gastoGasolina;

            const novoDia = {
                uid: currentUser.uid,
                timestamp: Date.now(),
                data: dataFormatada,
                mesAno: mesAno,
                bruto: totalBruto,
                gasolina: gastoGasolina,
                lucro: lucroLiquido,
                corridas: [...corridasHoje]
            };

            btnFechar.disabled = true;
            btnFechar.innerText = 'Salvando...';

            await addDoc(collection(db, "historico_entregas"), novoDia);

            corridasHoje = [];
            document.getElementById('odometroKm').value = '';
            document.getElementById('mediaKmL').value = '';
            salvarLocalEAtualizar();
            await carregarDadosNuvem();
            showErrorPopup('Seu expediente foi gravado no banco de dados!', '🎉 Dia Salvo');

        } catch (error) {
            console.error("Erro ao salvar:", error);
            showErrorPopup('Falha ao gravar os dados no banco de dados. Tente novamente.');
        } finally {
            btnFechar.disabled = false;
            btnFechar.innerText = 'Calcular e Salvar';
        }
    }

    function salvarLocalEAtualizar() {
        localStorage.setItem('corridasHoje', JSON.stringify(corridasHoje));
        atualizarTelaGeral();
    }

    function atualizarTelaGeral() {
        const divCorridas = document.getElementById('listaCorridasHoje');
        divCorridas.innerHTML = '';
        let totalBrutoHoje = 0;

        if (corridasHoje.length > 0) {
            divCorridas.innerHTML = '<strong>Corridas da Sessão:</strong>';
            corridasHoje.forEach((val, index) => {
                totalBrutoHoje += val;
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `<span>Corrida #${index+1}: R$ ${val.toFixed(2)}</span>`;
                
                const btnDel = document.createElement('button');
                btnDel.className = 'btn-del';
                btnDel.innerText = '❌';
                btnDel.onclick = () => {
                    corridasHoje.splice(index, 1);
                    salvarLocalEAtualizar();
                };
                
                row.appendChild(btnDel);
                divCorridas.appendChild(row);
            });

            const totalRow = document.createElement('div');
            totalRow.className = 'item-row';
            totalRow.style.fontWeight = 'bold';
            totalRow.innerHTML = `<span>Total Bruto:</span><span>R$ ${totalBrutoHoje.toFixed(2)}</span>`;
            divCorridas.appendChild(totalRow);
        } else {
            divCorridas.innerHTML = '<span style="color: var(--text-muted); font-size: 0.9rem;">Nenhuma corrida avulsa aberta.</span>';
        }

        renderizarHistorico();
    }

    function renderizarHistorico() {
        const selectFiltro = document.getElementById('filtroMes');
        const valorSelecionado = selectFiltro.value;
        const mesesDisponiveis = [...new Set(historicoNuvem.map(h => h.mesAno))];
        
        selectFiltro.innerHTML = '<option value="TODOS">Todos os Meses</option>';
        mesesDisponiveis.forEach(m => {
            selectFiltro.innerHTML += `<option value="${m}">${m}</option>`;
        });
        selectFiltro.value = valorSelecionado && mesesDisponiveis.includes(valorSelecionado) ? valorSelecionado : "TODOS";

        const divHistorico = document.getElementById('listaHistorico');
        divHistorico.innerHTML = '';

        const historicoFiltrado = selectFiltro.value === "TODOS" 
            ? historicoNuvem 
            : historicoNuvem.filter(h => h.mesAno === selectFiltro.value);

        historicoFiltrado.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        if (historicoFiltrado.length > 0) {
            historicoFiltrado.forEach(item => {
                let corridasHtml = item.corridas ? item.corridas.map((c, i) => `Corrida #${i+1}: R$ ${c.toFixed(2)}`).join('<br>') : '';

                const cardItem = document.createElement('div');
                cardItem.style.cssText = 'border-bottom: 1px solid var(--border); padding: 8px 0;';
                cardItem.innerHTML = `
                    <div class="item-row" style="border:none; padding:0;">
                        <div>
                            <strong>${item.data}</strong> (${item.corridas ? item.corridas.length : 0} corridas)<br>
                            <small style="color: var(--text-muted);">Bruto: R$ ${item.bruto.toFixed(2)} | Gasolina: -R$ ${item.gasolina.toFixed(2)}</small>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span style="font-weight: bold; color: var(--success);">+R$ ${item.lucro.toFixed(2)}</span>
                            <button class="btn-del btn-apagar-dia">🗑️</button>
                        </div>
                    </div>
                    <button class="btn-outline btn-small btn-ver-detalhes" style="margin-top: 4px;">🔍 Ver Corridas</button>
                    <div class="details-box hidden">
                        ${corridasHtml}
                    </div>
                `;

                cardItem.querySelector('.btn-apagar-dia').onclick = async () => {
                    if (confirm("Tem certeza que deseja apagar este dia?")) {
                        try {
                            await deleteDoc(doc(db, "historico_entregas", item.firebaseId));
                            await carregarDadosNuvem();
                        } catch (error) {
                            console.error("Erro ao deletar:", error);
                            showErrorPopup('Erro ao apagar o registro no banco de dados.');
                        }
                    }
                };

                const btnDetalhes = cardItem.querySelector('.btn-ver-detalhes');
                const boxDetalhes = cardItem.querySelector('.details-box');
                btnDetalhes.onclick = () => {
                    boxDetalhes.classList.toggle('hidden');
                };

                divHistorico.appendChild(cardItem);
            });
        } else {
            divHistorico.innerHTML = '<span style="color: var(--text-muted);">Nenhum registro encontrado na nuvem.</span>';
        }

        let lucroGeralNuvem = historicoNuvem.reduce((acc, h) => acc + h.lucro, 0);
        const falta = Math.max(0, metaParcela - lucroGeralNuvem);
        document.getElementById('lucroTotalDisplay').innerText = `R$ ${lucroGeralNuvem.toFixed(2)}`;
        document.getElementById('faltaDisplay').innerText = `R$ ${falta.toFixed(2)}`;
    }
</script>
</body>
</html>
